name: Antigravity Agent Super Profile Nightly Synthesis

on:
  schedule:
    # 07:30 America/Santiago (11:30 UTC)
    - cron: '30 11 * * *'
    # 21:30 America/Santiago (01:30 UTC next day)
    - cron: '30 1 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  synthesize-super-profiles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Antigravity Synthesis Cron Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AGENT_MCP_SECRET: ${{ secrets.AGENT_MCP_SECRET }}
          APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'https://agendapoli.vercel.app' }}
        run: |
          node premium/scripts/run-antigravity-cron.js
