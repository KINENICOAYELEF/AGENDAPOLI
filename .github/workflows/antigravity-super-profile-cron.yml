name: Antigravity Agent — Censo Docente Confiable

on:
  schedule:
    # Pares invierno/verano. El script valida la hora real de Santiago y solo
    # ejecuta una vez a las 07:30 y 21:30.
    - cron: '30 10 * * *'
    - cron: '30 11 * * *'
    - cron: '30 0 * * *'
    - cron: '30 1 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  synthesize-super-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: antigravity-clinical-census
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Antigravity Synthesis Cron Script
        env:
          AGENT_MCP_SECRET: ${{ secrets.AGENT_MCP_SECRET }}
          APP_URL: ${{ vars.AGENT_APP_URL || 'https://agendapoli.vercel.app' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          node premium/scripts/run-antigravity-cron.js
