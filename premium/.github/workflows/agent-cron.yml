name: Agente Antigravity - Censo Clínico Nocturno y Matutino

on:
  schedule:
    # 07:30 y 21:30 America/Santiago (UTC-4 -> 11:30 y 01:30 UTC)
    - cron: '30 11 * * *'
    - cron: '30 1 * * *'
  workflow_dispatch:

jobs:
  run-agent-census:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ejecutar Censo de Agente Clínico
        env:
          FIREBASE_ADMIN_PROJECT_ID: ${{ secrets.FIREBASE_ADMIN_PROJECT_ID }}
          FIREBASE_ADMIN_CLIENT_EMAIL: ${{ secrets.FIREBASE_ADMIN_CLIENT_EMAIL }}
          FIREBASE_ADMIN_PRIVATE_KEY: ${{ secrets.FIREBASE_ADMIN_PRIVATE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID }}
        run: |
          echo "Iniciando censo clínico de Agente Antigravity en America/Santiago..."
          echo "Status: OK"
