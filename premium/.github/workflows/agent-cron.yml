name: Agente Antigravity - Censo Clínico Nocturno y Matutino

on:
  schedule:
    # 07:30 y 21:30 America/Santiago (UTC-4 -> 11:30 y 01:30 UTC)
    - cron: '30 11 * * *'
    - cron: '30 1 * * *'
  workflow_dispatch:

jobs:
  run-agent-census:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ejecutar Censo de Agente Clínico
        env:
          APP_URL: ${{ vars.AGENT_APP_URL || 'https://agendapoli.vercel.app' }}
          AGENT_MCP_SECRET: ${{ secrets.AGENT_MCP_SECRET }}
        run: |
          test -n "$AGENT_MCP_SECRET" || { echo "Falta el secreto AGENT_MCP_SECRET"; exit 1; }
          echo "Solicitando censo clínico privado en $APP_URL..."
          curl --fail-with-body --retry 2 --retry-delay 5 --max-time 30 \
            -X POST "$APP_URL/api/agent/run" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $AGENT_MCP_SECRET" \
            --data '{"triggeredBy":"cron","sync":false}'
